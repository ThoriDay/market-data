name: Fetch market data

on:
  schedule:
    # GitHub runs schedules in UTC, "best effort": runs on a busy shared
    # scheduler can start hours late or be skipped (on 24-25 Nov they ran
    # 1-10 hours late, e.g. 01:24 IST). So the morning gets several tries at
    # odd minutes, and an outside timer (cron-job.org) triggers the run on time
    # through workflow_dispatch below. Whichever comes first refreshes the data.
    - cron: "17 0 * * 1-5"   # 05:47 IST (early try)
    - cron: "43 0 * * 1-5"   # 06:13 IST
    - cron: "11 1 * * 1-5"   # 06:41 IST
    - cron: "37 1 * * 1-5"   # 07:07 IST
    - cron: "3 2 * * 1-5"    # 07:33 IST (last morning try)
    - cron: "19 4 * * 1-5"   # 09:49 IST (opening range for the 9:50 check-in)
    - cron: "23 10 * * 1-5"  # 15:53 IST (full-day candles for the replay)
  workflow_dispatch: {}      # "Run workflow" button, and the API call cron-job.org makes
  repository_dispatch:
    types: [fetch]

permissions:
  contents: write

concurrency:
  group: fetch-market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install yfinance pandas requests

      - name: Download candles
        run: python fetch_data.py

      - name: Save to the repository
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Market data $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST') (${{ github.event_name }})" || echo "No changes"
          git pull --rebase
          git push
